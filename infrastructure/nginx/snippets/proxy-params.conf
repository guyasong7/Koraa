# Included by every proxy_pass in koraa.conf.
#
# Host is forwarded unchanged: proxy.ts (Next.js) derives the store slug from it,
# and Django's ALLOWED_HOSTS / USE_X_FORWARDED_HOST check it.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Django's SECURE_PROXY_SSL_HEADER reads this. Without it, DEBUG=False plus
# SECURE_SSL_REDIRECT=True puts the client in an infinite redirect loop.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Websocket/SSE upgrade passthrough.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_redirect off;
proxy_buffering on;

# Longer than gunicorn's own timeout so gunicorn produces the error, not nginx.
proxy_connect_timeout 10s;
proxy_send_timeout    75s;
proxy_read_timeout    75s;
