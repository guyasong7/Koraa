# TLS settings, included by every HTTPS server block in koraa.conf.
# Mozilla "intermediate" profile: TLS 1.2 + 1.3, no RSA key exchange.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

ssl_session_timeout 1d;
ssl_session_cache shared:KoraaSSL:10m;
ssl_session_tickets off;

# HSTS is also set by Django for API responses; this covers the static and
# Next.js responses nginx answers itself. Only enable the preload directive once
# the domain is genuinely committed to HTTPS — it is hard to undo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
