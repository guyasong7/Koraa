# Koraa production nginx — API only.
#
# Mounted at /etc/nginx/conf.d/default.conf by
# infrastructure/docker/docker-compose.ec2.yml.
#
# This is NOT koraa.conf. That file routes the apex, www, and every
# *.koraa.africa storefront to a `web` (Next.js) container, and declares
# `upstream koraa_web { server web:3000; }`. The frontend is deployed on Vercel,
# so no such container exists — and nginx resolves upstream hostnames at startup,
# so koraa.conf makes the container exit with "host not found in upstream
# 'web'" rather than degrade. Use koraa.conf only for an all-in-one host that
# really does run the Next.js app.
#
# Host routing here:
#   44-215-174-165.sslip.io → gunicorn (Django)  — the current public API host
#   api.koraa.africa        → gunicorn (Django)  — ready for when that domain is
#                                                  owned; needs a cert covering it
#   anything else           → 444, connection closed without a response
#
# TLS is Let's Encrypt, not a Cloudflare Origin CA certificate, and the reason is
# worth knowing before someone "fixes" it: no domain is owned yet. The frontend is
# a *.vercel.app deployment, so there is no zone to put in front of this origin —
# Cloudflare cannot proxy a hostname it does not serve, and Let's Encrypt refuses
# to issue for *.amazonaws.com, ruling out the instance's own AWS hostname too.
# sslip.io maps 44-215-174-165.sslip.io to this box's Elastic IP and Let's Encrypt
# will issue for that, which is the only thing that lets a browser on the HTTPS
# Vercel page reach this API at all: mixed-content rules block a plain-HTTP call
# outright.
#
# The cost is that 80 and 443 are open to the internet rather than to Cloudflare's
# ranges. The real-IP snippet below and the Cloudflare security-group rules are
# deliberately left in place, so moving back behind Cloudflare once a domain
# exists is one DNS record, one certificate and one security-group revoke.
# See infrastructure/aws/setup-letsencrypt.sh.

upstream koraa_backend {
    server backend:8000;
    keepalive 32;
}

# Restore the real client address from CF-Connecting-IP. Must come before the
# limit_req zones below, which key on $binary_remote_addr — see the header of
# update-cloudflare-ips.sh for what breaks without it.
#
# Inert while traffic arrives directly: real_ip only honours the header from the
# listed ranges, so a client forging CF-Connecting-IP is ignored and
# $remote_addr stays the true peer. Kept so that putting Cloudflare in front
# later needs no change here.
include /etc/nginx/snippets/cloudflare-real-ip.conf;

# Trust the client's protocol as reported by Cloudflare; fall back to the scheme
# this server terminated when the header is absent (a direct origin hit).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# Only echo Connection: upgrade back when the client actually asked for it;
# otherwise close, so keepalive to the upstream is not broken.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_http_version 1.1;

client_max_body_size 25m;   # product image uploads
server_tokens off;

# Rate limit auth and checkout endpoints. 10MB holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=koraa_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=koraa_api:10m rate=120r/m;

# ── Unknown hostnames ─────────────────────────────────────────────────────────
# Requests that name neither API host are a scanner, or someone pointing their own
# domain at this IP, and get no response at all rather than a default vhost to
# fingerprint. With the origin now directly exposed this is the block that absorbs
# the internet's background noise.
#
# The 443 block still needs a certificate: TLS is negotiated before the Host
# header is readable, so without one the handshake fails instead of the request.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 444;
}

# ── HTTP → HTTPS, and the ACME challenge ──────────────────────────────────────
# The redirect is a `location /` rather than a server-level `return 301` on
# purpose: a server-level return is evaluated in the rewrite phase, before nginx
# picks a location, so it would swallow the challenge path too and every renewal
# would fail. Let's Encrypt's HTTP-01 validator does not follow redirects to
# HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 44-215-174-165.sslip.io api.koraa.africa;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API ───────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 44-215-174-165.sslip.io api.koraa.africa;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Uploaded files, when media is on the local volume rather than S3. With
    # USE_S3=True nothing writes here and MEDIA_URL points at the bucket, so this
    # serves only files uploaded before the switch — kept so those keep resolving,
    # and so turning S3 back off needs no nginx change.
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Never let an uploaded file be interpreted as a script or as inline
        # HTML on the API origin.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    location = /api/v1/auth/login/ {
        limit_req zone=koraa_auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    location = /api/v1/auth/register/ {
        limit_req zone=koraa_auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    location = /api/v1/auth/password-reset/ {
        limit_req zone=koraa_auth burst=3 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    # Fapshi posts payment results here. Not rate limited: a throttled webhook
    # is a payment that never activates. The view re-checks every status
    # directly with Fapshi, so an unauthenticated POST cannot forge one.
    location = /api/v1/payments/webhook/fapshi/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    location / {
        limit_req zone=koraa_api burst=60 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }
}
