# Koraa production nginx.
#
# Mounted at /etc/nginx/conf.d/default.conf by
# infrastructure/docker/docker-compose.prod.yml.
#
# Host routing:
#   koraa.africa, www.koraa.africa   → Next.js  (landing, auth, dashboard)
#   <slug>.koraa.africa              → Next.js  (proxy.ts rewrites to /store/<slug>)
#   api.koraa.africa                 → gunicorn (Django) + /media
#   anything else                    → Next.js  (custom merchant domains)
#
# Replace koraa.africa throughout if the root domain differs, and keep it in
# step with NEXT_PUBLIC_ROOT_DOMAIN and KORAA_ROOT_DOMAIN.

upstream koraa_web {
    server web:3000;
    keepalive 32;
}

upstream koraa_backend {
    server backend:8000;
    keepalive 32;
}

# Trust the client's protocol when there is a proxy in front (Cloudflare, a load
# balancer); otherwise report the scheme this server terminated.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# Only echo Connection: upgrade back when the client actually asked for it;
# otherwise close, so keepalive to the upstream is not broken.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Shared proxy settings ─────────────────────────────────────────────────────
# The Host header is passed through unchanged on purpose: proxy.ts derives the
# store slug from it, and rewriting it would send every storefront to the
# marketing site.
proxy_http_version 1.1;

client_max_body_size 25m;   # product image uploads
server_tokens off;

# Rate limit auth and checkout endpoints. 10MB holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=koraa_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=koraa_api:10m rate=120r/m;

# ── HTTP: ACME + redirect to HTTPS ────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Certbot webroot. Must stay reachable over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API ───────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.koraa.africa;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Uploaded product images. Served by nginx so gunicorn workers are not tied
    # up streaming files. Ignored when media lives in Cloudflare R2.
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Never let an uploaded file be interpreted as a script or as inline
        # HTML on the API origin.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    location = /api/v1/auth/login/ {
        limit_req zone=koraa_auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    location = /api/v1/auth/register/ {
        limit_req zone=koraa_auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    location = /api/v1/auth/password-reset/ {
        limit_req zone=koraa_auth burst=3 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    # Fapshi posts payment results here. Not rate limited: a throttled webhook
    # is a payment that never activates. The view re-checks every status
    # directly with Fapshi, so an unauthenticated POST cannot forge one.
    location = /api/v1/payments/webhook/fapshi/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    location / {
        limit_req zone=koraa_api burst=60 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }
}

# ── Marketing site, auth, dashboard, and every storefront subdomain ───────────
# One block for the apex, www, and *.koraa.africa: they are all the same Next.js
# app, and proxy.ts decides what to render from the Host header.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name koraa.africa www.koraa.africa *.koraa.africa;

    # Must be a wildcard certificate covering both koraa.africa and
    # *.koraa.africa, or storefront subdomains fail TLS.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Same-origin path to the API. Lets a storefront on a custom domain call the
    # API without any CORS configuration — point NEXT_PUBLIC_API_URL at
    # /api/v1 to use it.
    location /api/ {
        limit_req zone=koraa_api burst=60 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_backend;
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Hashed filenames, safe to cache permanently.
    location /_next/static/ {
        proxy_pass http://koraa_web;
        include /etc/nginx/snippets/proxy-params.conf;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://koraa_web;
    }
}

# ── Custom merchant domains ───────────────────────────────────────────────────
# A merchant points their own domain at this server; proxy.ts passes the
# hostname through as the store lookup key. TLS for these needs a certificate
# per domain — issue one and add a server block, or terminate them at a proxy
# that can (Cloudflare for SaaS, Caddy on-demand TLS).
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name shop.example.com;
#     ssl_certificate     /etc/nginx/certs/shop.example.com/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/shop.example.com/privkey.pem;
#     include /etc/nginx/snippets/ssl-params.conf;
#     location / {
#         include /etc/nginx/snippets/proxy-params.conf;
#         proxy_pass http://koraa_web;
#     }
# }
