version: "3.9"

services:
  # ─── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: koraa_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koraa_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-koraa_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koraa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache / Message Broker ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: koraa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: koraa_backend
    restart: unless-stopped
    volumes:
      - ../../backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-koraa}:${POSTGRES_PASSWORD:-koraa_dev_secret}@db:5432/${POSTGRES_DB:-koraa_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # ─── Celery Worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: koraa_celery_worker
    restart: unless-stopped
    volumes:
      - ../../backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-koraa}:${POSTGRES_PASSWORD:-koraa_dev_secret}@db:5432/${POSTGRES_DB:-koraa_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DEBUG=${DEBUG:-True}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=4

  # ─── Celery Beat ───────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: koraa_celery_beat
    restart: unless-stopped
    volumes:
      - ../../backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-koraa}:${POSTGRES_PASSWORD:-koraa_dev_secret}@db:5432/${POSTGRES_DB:-koraa_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DEBUG=${DEBUG:-True}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
  media_files:
