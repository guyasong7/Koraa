# Production stack. Bring up with:
#   docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from docker-compose.yml (development):
#   - gunicorn instead of runserver, via the image's CMD
#   - no source bind-mounts, so the image is what runs
#   - Postgres and Redis are not published to the host
#   - every secret is required; none has a development fallback

services:
  db:
    image: postgres:16-alpine
    container_name: koraa_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    # Deliberately not published to the host.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: koraa_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migrations run once, as their own unit, so three gunicorn workers do not
  # race each other applying the same migration on boot.
  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: koraa-backend:latest
    container_name: koraa_migrate
    restart: "no"
    env_file: &backend_env
      - ../../backend/.env.prod
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py migrate --noinput

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: koraa-backend:latest
    container_name: koraa_backend
    restart: unless-stopped
    volumes:
      - media_files:/app/media
    env_file: *backend_env
    environment: *backend_environment
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # CMD from the Dockerfile runs gunicorn.

  celery_worker:
    image: koraa-backend:latest
    container_name: koraa_celery_worker
    restart: unless-stopped
    volumes:
      - media_files:/app/media
    env_file: *backend_env
    environment: *backend_environment
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A config worker --loglevel=info --concurrency=2

  celery_beat:
    image: koraa-backend:latest
    container_name: koraa_celery_beat
    restart: unless-stopped
    env_file: *backend_env
    environment: *backend_environment
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  web:
    build:
      # Monorepo root: apps/web is an npm workspace and needs the root lockfile.
      context: ../..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* is inlined into the client bundle at build time, so these
      # are build args. Changing any of them requires --build to take effect.
      args:
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:?set NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_DASHBOARD_ORIGIN: ${NEXT_PUBLIC_DASHBOARD_ORIGIN:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?set NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?set NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?set NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?set NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
    image: koraa-web:latest
    container_name: koraa_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side only, never inlined into the browser bundle: server
      # components reach the API over the compose network instead of hairpinning
      # back out through nginx and TLS.
      INTERNAL_API_URL: http://backend:8000/api/v1
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: koraa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/koraa.conf:/etc/nginx/conf.d/default.conf:ro
      # snippets/ deliberately NOT under conf.d: nginx parses every .conf in
      # conf.d at http level, and a bare proxy_set_header there fails to load.
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - media_files:/var/www/media:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - web
    # nginx reads the certificate once at startup and holds it, so a renewal
    # 60 days from now is invisible until the config is reloaded. Reloading on a
    # timer is what makes renewal actually take effect; `nginx -s reload` is
    # graceful, so in-flight requests are unaffected and the six-hourly cost of
    # a no-op reload is nil.
    command:
      - /bin/sh
      - -c
      - |
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        nginx -g 'daemon off;'

  # Renewal only. The FIRST certificate comes from init-letsencrypt.sh, which has
  # to be run once before this stack can start at all — nginx refuses to load a
  # config whose ssl_certificate file does not exist.
  #
  # certonly is not run here for a reason: `certbot renew` replays whatever
  # challenge each certificate was originally issued with, reading the plugin and
  # credentials path out of the renewal config, so the bootstrap script's choices
  # carry forward without being restated.
  certbot:
    image: certbot/dns-cloudflare:v2.11.0
    container_name: koraa_certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      # Where nginx reads its certificate from. The deploy hook writes here.
      - ./certs:/certs
      # Only used by HTTP-01 renewals, i.e. per-domain certificates for custom
      # merchant domains. The wildcard is DNS-01 and never touches it.
      - certbot_webroot:/var/www/certbot
    # Twice a day is the interval Let's Encrypt asks for. Renewal is a no-op
    # until a certificate is inside 30 days of expiry, so this is cheap; checking
    # often means a failed attempt has many retries left before anything expires.
    #
    # RENEWED_LINEAGE is set by certbot for the deploy hook and points at the
    # live/ directory of the certificate that was just renewed — using it instead
    # of a hardcoded domain keeps this correct when custom-domain certificates are
    # added. The hook only runs when something actually renewed.
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --quiet --deploy-hook 'cp -L "$$RENEWED_LINEAGE/fullchain.pem" /certs/fullchain.pem && cp -L "$$RENEWED_LINEAGE/privkey.pem" /certs/privkey.pem && chmod 644 /certs/fullchain.pem && chmod 640 /certs/privkey.pem'
          sleep 12h & wait $${!}
        done

volumes:
  postgres_data:
  redis_data:
  media_files:
  certbot_webroot:
  # Certbot's account key, issued certificates, renewal config, and the DNS API
  # credentials written by init-letsencrypt.sh. Losing this volume means
  # re-issuing from scratch, which is rate-limited to 5 per week per domain.
  letsencrypt:

