<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Koraa{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: {% block width %}560px{% endblock %};
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.07);
            border: 1px solid #e2e8f0;
        }
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            text-align: center;
            padding: 28px 20px;
        }
        .logo {
            height: 36px;
            width: auto;
        }
        .content {
            padding: 32px 32px 32px;
            color: #334155;
            line-height: 1.6;
        }
        h1 {
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 16px;
        }
        p {
            margin: 0 0 20px;
            font-size: 15px;
        }
        .muted {
            font-size: 14px;
            color: #64748b;
        }
        .cta {
            display: inline-block;
            background-color: #a8530f;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            padding: 13px 26px;
            border-radius: 8px;
        }
        .panel {
            background-color: #f1f5f9;
            border-radius: 8px;
            padding: 20px 24px;
            margin: 24px 0;
        }
        .footer {
            background-color: #f8fafc;
            padding: 24px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
            line-height: 1.6;
        }
        .footer a {
            color: #94a3b8;
            text-decoration: none;
        }
        table.lines {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table.lines th {
            text-align: left;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 0 8px;
        }
        table.lines td {
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }
        table.lines td.num,
        table.lines th.num {
            text-align: right;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            {% block header %}
            <a href="{{ dashboard_url|default:'https://koraa.cm' }}" style="text-decoration: none;">
                <img src="https://koraa.cm/koraa-logo-white.png" alt="Koraa" class="logo">
            </a>
            {% endblock %}
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            {% block footer %}
            &copy; {% now "Y" %} Koraa &mdash; A Cameroonian commerce platform<br>
            <a href="{{ dashboard_url|default:'https://koraa.cm' }}/privacy">Privacy</a> &middot;
            <a href="{{ dashboard_url|default:'https://koraa.cm' }}/terms">Terms</a> &middot;
            <a href="mailto:support@koraa.cm">support@koraa.cm</a>
            {% endblock %}
        </div>
    </div>
</body>
</html>
