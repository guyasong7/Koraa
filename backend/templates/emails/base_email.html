<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Koraa{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: {% block width %}560px{% endblock %};
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
        .header {
            text-align: center;
            padding: 30px 20px 20px;
        }
        .logo {
            height: 48px;
            width: auto;
        }
        .content {
            padding: 0 32px 32px;
            color: #334155;
            line-height: 1.6;
        }
        h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 16px;
        }
        p {
            margin: 0 0 20px;
            font-size: 15px;
        }
        .muted {
            font-size: 14px;
            color: #64748b;
        }
        .cta {
            display: inline-block;
            background-color: #7c3aed;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            padding: 13px 26px;
            border-radius: 6px;
        }
        .panel {
            background-color: #f1f5f9;
            border-radius: 6px;
            padding: 20px 24px;
            margin: 24px 0;
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #e2e8f0;
        }
        table.lines {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table.lines th {
            text-align: left;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 0 8px;
        }
        table.lines td {
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }
        table.lines td.num,
        table.lines th.num {
            text-align: right;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            {% block header %}
            <img src="{{ dashboard_url }}/koraa-logo.png" alt="Koraa" class="logo">
            {% endblock %}
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            {% block footer %}&copy; {% now "Y" %} Koraa. All rights reserved.{% endblock %}
        </div>
    </div>
</body>
</html>
